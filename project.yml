# Projet Xcode généré par XcodeGen (dans GitHub Actions) : pas besoin de Mac.
name: Dose
options:
  bundleIdPrefix: com.luka
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual

targets:
  Dose:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        ALTAppGroups: [group.com.luka.dose]
    entitlements:
      path: App/Dose.entitlements
      properties:
        com.apple.security.application-groups: [group.com.luka.dose]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luka.dose
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DoseWidgets

  DoseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Dose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ALTAppGroups: [group.com.luka.dose]
    entitlements:
      path: Widgets/DoseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.luka.dose]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luka.dose.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  Dose:
    build:
      targets:
        Dose: all
        DoseWidgets: all
